<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mood Color Changer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer ></script>
</head>
<body>
    <h1>My Mood Color Changer</h1>
    <div class="moodcolor">

        <h3>🎨 </h3>
        <h2 id="mood">Choose Your Mood</h2>
        <p id="message" >Click a button to change my mood</p>
    </div>
    <button id="happy">😊Happy</button>
    <button id="calm"> 😌 Calm</button>
    <button id="excited">🤩 Excited</button>
    <br><br>
    <button id="reset">⟲ Reset</button>
</body>
</html>
